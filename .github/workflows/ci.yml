name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # arch-core 的 commit_diff 测试要对仓内历史提交 2b66deb..29f8e27 求差，浅克隆会报 UnknownCommit。
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: install gpu window deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev xvfb mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools x11-utils openbox
      - name: build (locked)
        run: cargo build --locked --workspace
      - name: seed history fixture
        # tests/fixtures/history 由 history-seed/build.ps1 生成且被 .gitignore 排除，
        # 不进仓库；arch-core 的 history_prefixes 断言依赖它，测试前必须重建。
        shell: pwsh
        run: pwsh -NoProfile -File tests/fixtures/history-seed/build.ps1
      - name: test (locked)
        if: runner.os != 'Linux'
        # 几何等价（base vs A）等模型断言在 CI 常态执行；像素断言依赖可见桌面，留在 eval 脚本。
        # 本 job 不拉取 pinned 语料：arch-cli 全部不跑；arch-core 只跳过 resolution_golden 的两个
        # 语料基线（tsx/excalidraw），其余 arch-core / arch-view 测试全部执行。
        run: cargo test --locked -p arch-view -p arch-core -- --skip tsx_golden_baseline --skip excalidraw_golden_baseline
      - name: test (locked, xvfb)
        if: runner.os == 'Linux'
        # 多个集成测试会真的启动窗口（smoke / scene_snapshot / timeline_loading），headless 下 gpui
        # 初始化即 panic；这里按窗口 smoke 同一套虚拟显示 + 软件 Vulkan 跑，不跳过任何用例。
        shell: bash
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES="$(compgen -G "/usr/share/vulkan/icd.d/lvp_icd*.json" | head -n1)"
          xvfb-run -a -s "-screen 0 1280x1024x24" bash -c \
            'openbox >/dev/null 2>&1 & sleep 1; exec cargo test --locked -p arch-view -p arch-core -- --skip tsx_golden_baseline --skip excalidraw_golden_baseline'
      - name: windows window smoke
        if: runner.os == 'Windows'
        run: cargo run --locked -p arch-view -- smoke tests/fixtures/tiny
      - name: linux display and vulkan diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # 诊断步骤只留环境读数，不参与门禁判定。
          set +e
          export xvfb_args='-screen 0 1280x1024x24'
          echo "== xdpyinfo: version/screen/extensions =="
          xvfb-run -a -s "${xvfb_args}" timeout 20s xdpyinfo | sed -n '1,6p'
          xvfb-run -a -s "${xvfb_args}" timeout 20s xdpyinfo -queryExtensions \
            | grep -E "SYNC|XInputExtension|PRESENT|RANDR|Composite|GLX"
          echo "== xrandr --query =="
          xvfb-run -a -s "${xvfb_args}" timeout 20s xrandr --query
          echo "== vulkan ICDs =="
          ls -1 /usr/share/vulkan/icd.d
          echo "== vulkaninfo --summary =="
          xvfb-run -a -s "${xvfb_args}" timeout 40s vulkaninfo --summary
          echo "== diagnostics exit (not gating) =="
      - name: linux window smoke (xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          export STRATA_PHASE_MARKERS=1
          # blade 在 Linux 走 Vulkan（不是 GL）：显式指定 lavapipe，避免隐式选驱动。
          export VK_ICD_FILENAMES="$(compgen -G "/usr/share/vulkan/icd.d/lvp_icd*.json" | head -n1)"
          # 必须有窗口管理器：无 WM 的虚拟显示里 gpui 的 X11 后端不会启动帧请求循环，
          # `on_next_frame` 永不回调（取证见 docs/acceptance-gaps.md 2.2.2 与 CI run 42501294926）。
          # 软件渲染只用于验证窗口真的出帧，不代表真实 GPU 表现。
          set +e
          timeout -k 10s 90s xvfb-run -a -s "-screen 0 1280x1024x24" bash -c \
            'openbox >/dev/null 2>&1 & sleep 1; exec cargo run --locked -p arch-view -- smoke tests/fixtures/tiny' \
            2>&1 | tee out/linux-window-smoke.log
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -eq 0 ] && grep -q "smoke: frame rendered" out/linux-window-smoke.log; then
            echo "== linux smoke: PASS (exit 0, frame marker found) =="
          else
            echo "== linux smoke: FAIL (exit ${status}) =="
            exit 1
          fi

  reveal-budget:
    name: reveal budget (software rendering)
    # 只在手动 dispatch 时跑：这是取证 job（软件渲染 / 单核低端代理下的揭示时长），
    # 不参与每次 push 的门禁；读数写进 ticket 10。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install gpu window deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev xvfb mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools x11-utils openbox
      - name: fetch corpus (excalidraw)
        shell: pwsh
        run: pwsh -NoProfile -File eval/fetch-corpus.ps1 -Name excalidraw
      - name: build release
        run: cargo build --locked --release -p arch-view
      - name: reveal timing (lavapipe, 3 runs)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/reveal
          export VK_ICD_FILENAMES="$(compgen -G "/usr/share/vulkan/icd.d/lvp_icd*.json" | head -n1)"
          for i in 1 2 3; do
            xvfb-run -a -s "-screen 0 1280x1024x24" bash -c \
              "openbox >/dev/null 2>&1 & sleep 1; exec pwsh -NoProfile -File eval/frame-timing.ps1 -Mode reveal -Exe target/release/arch-view -RevealAutoCloseMs 60000 -OutJson out/reveal/soft-$i.json" \
              2>&1 | tee "out/reveal/soft-$i.log"
          done
      - name: reveal timing (lavapipe + 1 CPU, 3 runs)
        shell: bash
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES="$(compgen -G "/usr/share/vulkan/icd.d/lvp_icd*.json" | head -n1)"
          for i in 1 2 3; do
            xvfb-run -a -s "-screen 0 1280x1024x24" bash -c \
              "openbox >/dev/null 2>&1 & sleep 1; exec taskset -c 0 pwsh -NoProfile -File eval/frame-timing.ps1 -Mode reveal -Exe target/release/arch-view -RevealAutoCloseMs 150000 -OutJson out/reveal/soft-1cpu-$i.json" \
              2>&1 | tee "out/reveal/soft-1cpu-$i.log"
          done
      - name: summarize reveal durations
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem out/reveal/*.json | Sort-Object Name) {
            $data = Get-Content $file.FullName -Raw | ConvertFrom-Json
            $duration = if ($null -ne $data.revealStartMs -and $null -ne $data.revealDoneMs) {
              [math]::Round($data.revealDoneMs - $data.revealStartMs, 1)
            } else { "missing" }
            "{0}: reveal={1}ms frames={2} intervalMedian={3}ms p95={4}ms exit={5}" -f `
              $file.Name, $duration, $data.framesTotal, $data.intervals.medianMs, $data.intervals.p95Ms, $data.exitCode
          }
      - name: upload reveal budget artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reveal-budget
          path: out/reveal
          if-no-files-found: warn
          retention-days: 14

  drift:
    name: drift gate
    runs-on: windows-latest
    # 门禁由 eval/drift-gate.ps1 按改动路径判定；未触及 drift 输入面时 job 秒退并通过。
    # 语料用 eval/fetch-corpus.ps1 拉取并按 pin 校验，缓存 key 带 corpus.toml 哈希，
    # pin 变化自动失效。语料不可用时：
    #   - 非基线改动 -> corpus 标 skipped，coverage.missing 写明缺口，job 仍绿；
    #   - 基线/pin 改动 -> 脚本直接判红（退出 1），不允许降级通过。
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: plan
        id: plan
        shell: pwsh
        run: |
          $event = "${{ github.event_name }}"
          $base = "${{ github.base_ref }}"
          if ($base) {
            $base = "origin/$base"
          } else {
            $base = "${{ github.event.before }}"
          }
          $forceFull = $event -eq 'workflow_dispatch'
          if (-not $base -or $base -match '^0+$') {
            # dispatch 没有 before；用默认分支做 diff 基线，仍能识别基线改动，
            # 同时靠 -ForceFull 保持保守全跑。
            if ($forceFull) {
              $base = 'origin/${{ github.event.repository.default_branch }}'
            } else {
              $base = 'NONE'
            }
          }
          $planArgs = @('-NoProfile', '-File', 'eval/drift-gate.ps1', '-PlanOnly', '-BaseRef', $base)
          if ($forceFull) { $planArgs += '-ForceFull' }
          $plan = @(& pwsh @planArgs)
          $plan | Write-Output
          $required = if ($plan -contains 'required=true') { 'true' } else { 'false' }
          $corpusRequired = if ($plan -contains 'corpus_required=true') { 'true' } else { 'false' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "required=$required"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "corpus_required=$corpusRequired"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "base=$base"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "force_full=$($forceFull.ToString().ToLower())"
      - name: restore corpus cache
        id: corpus-cache
        if: steps.plan.outputs.required == 'true' && steps.plan.outputs.corpus_required == 'true'
        uses: actions/cache/restore@v4
        with:
          path: tests/corpus
          key: drift-corpus-${{ runner.os }}-${{ hashFiles('eval/corpus.toml') }}
      - name: fetch corpus
        if: steps.plan.outputs.required == 'true' && steps.plan.outputs.corpus_required == 'true' && steps.corpus-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        run: pwsh -NoProfile -File eval/fetch-corpus.ps1
      - name: verify corpus pins
        id: corpus-verify
        if: steps.plan.outputs.required == 'true' && steps.plan.outputs.corpus_required == 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -File eval/fetch-corpus.ps1 -VerifyOnly
          $verified = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "verified=$verified"
          if ($verified -ne 'true') {
            Write-Output "::warning::corpus pin 校验未通过；非基线改动将降级跳过，基线改动会判红"
          }
          exit 0
      - name: save corpus cache
        if: steps.plan.outputs.required == 'true' && steps.plan.outputs.corpus_required == 'true' && steps.corpus-cache.outputs.cache-hit != 'true' && steps.corpus-verify.outputs.verified == 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/corpus
          key: drift-corpus-${{ runner.os }}-${{ hashFiles('eval/corpus.toml') }}
      - name: build arch-cli
        if: steps.plan.outputs.required == 'true'
        run: cargo build --locked -p arch-cli
      - name: drift gate
        if: steps.plan.outputs.required == 'true'
        shell: pwsh
        env:
          PLAN_CORPUS_REQUIRED: ${{ steps.plan.outputs.corpus_required }}
          CORPUS_VERIFIED: ${{ steps.corpus-verify.outputs.verified }}
        run: |
          $argv = @('-NoProfile', '-File', 'eval/drift-gate.ps1', '-BaseRef', '${{ steps.plan.outputs.base }}')
          if ('${{ steps.plan.outputs.force_full }}' -eq 'true') {
            $argv += '-ForceFull'
          }
          if ($env:PLAN_CORPUS_REQUIRED -eq 'true' -and $env:CORPUS_VERIFIED -ne 'true') {
            $argv += '-CorpusUnavailable'
          }
          & pwsh @argv
          exit $LASTEXITCODE
      - name: upload drift artifacts
        if: always() && steps.plan.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-gate
          path: |
            out/drift-gate.json
            out/drift-*.json
          if-no-files-found: warn
          retention-days: 14
