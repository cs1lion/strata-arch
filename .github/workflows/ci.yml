name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build (locked)
        run: cargo build --locked --workspace
      - name: windows window smoke
        if: runner.os == 'Windows'
        run: cargo run --locked -p arch-view -- smoke tests/fixtures/tiny
