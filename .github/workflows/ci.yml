name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # arch-core 的 commit_diff 测试要对仓内历史提交 2b66deb..29f8e27 求差，浅克隆会报 UnknownCommit。
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: install gpu window deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev xvfb mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools x11-utils openbox
      - name: build (locked)
        run: cargo build --locked --workspace
      - name: seed history fixture
        # tests/fixtures/history 由 history-seed/build.ps1 生成且被 .gitignore 排除，
        # 不进仓库；arch-core 的 history_prefixes 断言依赖它，测试前必须重建。
        shell: pwsh
        run: pwsh -NoProfile -File tests/fixtures/history-seed/build.ps1
      - name: test (locked)
        if: runner.os != 'Linux'
        # 几何等价（base vs A）等模型断言在 CI 常态执行；像素断言依赖可见桌面，留在 eval 脚本。
        # 本 job 不拉取 pinned 语料：arch-cli 全部不跑；arch-core 只跳过 resolution_golden 的两个
        # 语料基线（tsx/excalidraw），其余 arch-core / arch-view 测试全部执行。
        run: cargo test --locked -p arch-view -p arch-core -- --skip tsx_golden_baseline --skip excalidraw_golden_baseline
      - name: test (locked, xvfb)
        if: runner.os == 'Linux'
        # 多个集成测试会真的启动窗口（smoke / scene_snapshot / timeline_loading），headless 下 gpui
        # 初始化即 panic；这里按窗口 smoke 同一套虚拟显示 + 软件 Vulkan 跑，不跳过任何用例。
        shell: bash
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES="$(compgen -G "/usr/share/vulkan/icd.d/lvp_icd*.json" | head -n1)"
          xvfb-run -a -s "-screen 0 1280x1024x24" bash -c \
            'openbox >/dev/null 2>&1 & sleep 1; exec cargo test --locked -p arch-view -p arch-core -- --skip tsx_golden_baseline --skip excalidraw_golden_baseline'
      - name: windows window smoke
        if: runner.os == 'Windows'
        run: cargo run --locked -p arch-view -- smoke tests/fixtures/tiny
      - name: macos window smoke (map)
        # 平台矩阵最后一块空白：macOS 目前只有编译验证。这里复用同一套阶段标记
        # （STRATA_PHASE_MARKERS + `phase: content:presented`）与「exit 0 + 标记命中」判据，
        # 不新造判定。--auto-close-ms 保证窗口自己退出；外层 bash 看门狗只防挂死。
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          export STRATA_PHASE_MARKERS=1
          ./target/debug/arch-view map tests/fixtures/layers \
            --auto-close-ms 5000 --no-reveal > out/macos-window-smoke.log 2>&1 &
          pid=$!
          # 纯 bash 看门狗：macOS runner 没有 GNU timeout，避免挂死拖满 job 上限。
          for _ in $(seq 1 90); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "macos smoke: timeout waiting for auto-close" >> out/macos-window-smoke.log
            kill -9 "$pid" 2>/dev/null || true
            status=124
          else
            wait "$pid"
            status=$?
          fi
          set -e
          cat out/macos-window-smoke.log
          if [ "$status" -eq 0 ] && grep -q "phase: content:presented" out/macos-window-smoke.log; then
            echo "== macos smoke: PASS (exit 0, content:presented) =="
          else
            echo "== macos smoke: FAIL (exit ${status}) =="
            exit 1
          fi
      - name: linux display and vulkan diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # 诊断步骤只留环境读数，不参与门禁判定。
          set +e
          export xvfb_args='-screen 0 1280x1024x24'
          echo "== xdpyinfo: version/screen/extensions =="
          xvfb-run -a -s "${xvfb_args}" timeout 20s xdpyinfo | sed -n '1,6p'
          xvfb-run -a -s "${xvfb_args}" timeout 20s xdpyinfo -queryExtensions \
            | grep -E "SYNC|XInputExtension|PRESENT|RANDR|Composite|GLX"
          echo "== xrandr --query =="
          xvfb-run -a -s "${xvfb_args}" timeout 20s xrandr --query
          echo "== vulkan ICDs =="
          ls -1 /usr/share/vulkan/icd.d
          echo "== vulkaninfo --summary =="
          xvfb-run -a -s "${xvfb_args}" timeout 40s vulkaninfo --summary
          echo "== diagnostics exit (not gating) =="
      - name: linux window smoke (xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          export STRATA_PHASE_MARKERS=1
          # blade 在 Linux 走 Vulkan（不是 GL）：显式指定 lavapipe，避免隐式选驱动。
          export VK_ICD_FILENAMES="$(compgen -G "/usr/share/vulkan/icd.d/lvp_icd*.json" | head -n1)"
          # 必须有窗口管理器：无 WM 的虚拟显示里 gpui 的 X11 后端不会启动帧请求循环，
          # `on_next_frame` 永不回调（取证见 docs/acceptance-gaps.md 2.2.2 与 CI run 42501294926）。
          # 软件渲染只用于验证窗口真的出帧，不代表真实 GPU 表现。
          set +e
          timeout -k 10s 90s xvfb-run -a -s "-screen 0 1280x1024x24" bash -c \
            'openbox >/dev/null 2>&1 & sleep 1; exec cargo run --locked -p arch-view -- smoke tests/fixtures/tiny' \
            2>&1 | tee out/linux-window-smoke.log
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -eq 0 ] && grep -q "smoke: frame rendered" out/linux-window-smoke.log; then
            echo "== linux smoke: PASS (exit 0, frame marker found) =="
          else
            echo "== linux smoke: FAIL (exit ${status}) =="
            exit 1
          fi

  fmt:
    name: fmt gate (cargo fmt --all --check)
    runs-on: ubuntu-latest
    # AGENTS.md 一直要求提交前 `cargo fmt --all --check`，但本 workflow 此前没有对应 job，
    # 该要求只靠人守，HEAD 上因此积累存量漂移（2026-11-16 由 chore 提交清掉，8 文件 +31/-19）。
    # 本 job 把这条既有要求变成机器门禁：只跑 rustfmt 检查，不编译，故不需要 GPU 窗口依赖与 rust-cache。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt check
        run: cargo fmt --all -- --check
      # 第 10 道门禁：拦 ENGINEERING-DISCIPLINE.md §5 第 7 条登记的第九类坑——
      # `Func $x -split $y` 会被解析成「把 -split 当作 Func 的命名参数」，语法合法、不报错、
      # 静默退化成单值，产出的是错的读数而不是异常。
      # 用内置 AST 而非 PSScriptAnalyzer：本机 Get-Module -ListAvailable 查无此模块，
      # runner 是否预装亦未证实，而引入它需要 PSGallery 出网，取包失败即整条门禁不可用。
      # 该 step 在三种失效态下自检为退出码 2（不可解析文件 / 两种参数声明形式有一种没入索引 /
      # 索引为空），不当作通过；判据不被跳过详见 eval/ps-param-lint.ps1 头部说明。
      - name: powershell param lint (operator-as-argument gate)
        shell: pwsh
        run: pwsh -NoProfile -File eval/ps-param-lint.ps1

  paired-selftest:
    name: paired-ab selftest (criteria regression, no desktop)
    runs-on: ubuntu-latest
    # 守的是判据式本身：paired-ab 的显著式、gap 减法方向、Round 位数、顺序偏置分组，
    # 以及两份脚本的语法与参数面。夹具存每对的原始读数，校验时用与 paired-ab 相同的
    # lib（eval/lib-paired-stats.ps1）重算，因此不是比对成品数字。
    # 除夹具重算外还跑性质断言（97e8817）：同号阈值与 k 必须是活参数（用 SigMinRatio=1.001 /
    # K=1000 复核结论翻转）、base 与变体互换必须让 meanMs 反号、rel% 必须用同侧 base 均值做分母。
    # 这批断言的存在理由：夹具数据里过门槛者 ratio 全为 6/6，单靠重算抓不到「同号阈值被写死」，
    # 实测注入即静默通过；性质断言补上该分支。受试组取不到时按失败计，不静默跳过。
    # 覆盖边界（勿当全套守护）：不含 paired-ab 读取 out/**/pair*.json 的路径与守卫逻辑，
    # 也不含 frame-timing 真实测量与像素证据——那些需要可见 Windows 桌面会话，
    # 仍是本机人工项（docs/acceptance-gaps.md）。
    # 纯 pwsh + 入仓夹具：无 cargo、无 rust toolchain、无 GPU/窗口依赖，故秒级完成。
    steps:
      - uses: actions/checkout@v4
      - name: paired-ab selftest
        shell: pwsh
        run: pwsh -NoProfile -File eval/paired-ab-selftest.ps1 -Fixture eval/baseline/paired-ab-selftest.json

  cite-check:
    name: citation consistency check (docs numbers vs source data)
    runs-on: ubuntu-latest
    # 守票 26：文档里的数字必须与源数据字段/算式一致，登记表为 eval/baseline/citations.json。
    # 三条边界必须在此写明，否则本 job 的绿会被误读为「所有文档数字都可信」：
    #   1) 只覆盖已登记项（首批 36 条，其中 30 条 ciVisible=true），未登记数字不受保护；
    #   2) 源在 gitignored out/** 的 6 条在本 job 下记 SKIP、不计入通过；默认**不启用**
    #      -RequireAllResolved（一启用即上线即红），待 out/ 源入仓或由入仓夹具替代覆盖后再升级；
    #   3) 工具自身的 negative control（-SelfTest，三种预置坏登记必须被抓）**不在 CI 跑**：
    #      其中 derived 坏登记的源在 out/，CI 上只会得到 SKIP 而被抓不到，放进 CI 会把
    #      「工具无效」误报成事实；该自证由本机执行（结果记录在 eval: ff9e31c 提交信息）。
    # 纯 pwsh + 入仓 JSON 与文档文本：无 cargo、无 rust toolchain、无 GPU/窗口依赖。
    # 登记面现状（截至 eval: e2f946d / 7dfa48f 之后）：条目 55，其中 ciVisible=true 47 条、out/** 源 6 条记 SKIP；
    # 上方「首批 36 条 / 30 条」是立项当时值，按不回改原则保留，引用时以本行为准。
    # 预期（非读数）：CI 上 PASS≈30 / FAIL=0 / SKIP=6；真实结果在首次 push 前一律按未验证处理。
    steps:
      - uses: actions/checkout@v4
      - name: cite-check
        shell: pwsh
        run: pwsh -NoProfile -File eval/cite-check.ps1
      - name: injection selftest
        # 元测试：断言检查器抓得住破坏，而不只是断言现状全绿。用例 C1a/b/c 基线须绿，
        # C2 活路径漏计必须让 paired-ab-selftest 变红，C3/C3b 把「叠加短路可逃逸 + 语句守护看不见」
        # 固化为断言（守护天花板留痕，哪天能抓了这两条会失败并提醒更新文档），
        # C4/C5/C6 分别掏空 Get-RgCount、清空 -SelfTest 的 failIds、抬高 expect，三者都必须变红。
        # 元测试自身有效性已反证：喂入「入仓 + 叠加 $invariantOk = $true」基准时 C2 由 PASS 翻 FAIL、整体退出码 1。
        # 副本一律写 eval/tmp-meta-* 并 try/finally 清理；本步不依赖 out/**，故 CI 上应与本机同判。
        shell: pwsh
        run: pwsh -NoProfile -File eval/injection-selftest.ps1

  clippy:
    name: clippy gate (workspace, all targets, -D warnings)
    runs-on: ubuntu-latest
    # 门禁：workspace 全目标以 `-D warnings` 跑 clippy；arch-core / arch-view 的既有与本次引入的 lint
    # 必须在清理后全绿，否则本 job 判红。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: install gpu window deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: clippy gate
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  reveal-budget:
    name: reveal budget (software rendering)
    # 只在手动 dispatch 时跑：这是取证 job（软件渲染 / 单核低端代理下的揭示时长），
    # 不参与每次 push 的门禁；读数写进 ticket 10。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install gpu window deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev xvfb mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools x11-utils openbox
      - name: fetch corpus (excalidraw)
        shell: pwsh
        run: pwsh -NoProfile -File eval/fetch-corpus.ps1 -Name excalidraw
      - name: build release
        run: cargo build --locked --release -p arch-view
      - name: reveal timing (lavapipe, 3 runs)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/reveal
          export VK_ICD_FILENAMES="$(compgen -G "/usr/share/vulkan/icd.d/lvp_icd*.json" | head -n1)"
          for i in 1 2 3; do
            xvfb-run -a -s "-screen 0 1280x1024x24" bash -c \
              "openbox >/dev/null 2>&1 & sleep 1; exec pwsh -NoProfile -File eval/frame-timing.ps1 -Mode reveal -Exe target/release/arch-view -RevealAutoCloseMs 60000 -OutJson out/reveal/soft-$i.json" \
              2>&1 | tee "out/reveal/soft-$i.log"
          done
      - name: reveal timing (lavapipe + 1 CPU, 3 runs)
        shell: bash
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES="$(compgen -G "/usr/share/vulkan/icd.d/lvp_icd*.json" | head -n1)"
          for i in 1 2 3; do
            xvfb-run -a -s "-screen 0 1280x1024x24" bash -c \
              "openbox >/dev/null 2>&1 & sleep 1; exec taskset -c 0 pwsh -NoProfile -File eval/frame-timing.ps1 -Mode reveal -Exe target/release/arch-view -RevealAutoCloseMs 60000 -OutJson out/reveal/soft-1cpu-$i.json" \
              2>&1 | tee "out/reveal/soft-1cpu-$i.log"
          done
      - name: reveal timing (small scene, lavapipe)
        # 诊断：小场景与大场景的揭示时长是否都收敛到同一固定时长。
        # 时长由 GPUI 动画时钟驱动，场景规模只应影响帧数、不应改变总时长。
        shell: bash
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES="$(compgen -G "/usr/share/vulkan/icd.d/lvp_icd*.json" | head -n1)"
          xvfb-run -a -s "-screen 0 1280x1024x24" bash -c \
            "openbox >/dev/null 2>&1 & sleep 1; exec pwsh -NoProfile -File eval/frame-timing.ps1 -Mode reveal -Repo tests/fixtures/layers -Exe target/release/arch-view -RevealAutoCloseMs 60000 -OutJson out/reveal/small-soft.json" \
            2>&1 | tee "out/reveal/small-soft.log"
      - name: reveal timing (small scene, lavapipe + 1 CPU)
        shell: bash
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES="$(compgen -G "/usr/share/vulkan/icd.d/lvp_icd*.json" | head -n1)"
          xvfb-run -a -s "-screen 0 1280x1024x24" bash -c \
            "openbox >/dev/null 2>&1 & sleep 1; exec taskset -c 0 pwsh -NoProfile -File eval/frame-timing.ps1 -Mode reveal -Repo tests/fixtures/layers -Exe target/release/arch-view -RevealAutoCloseMs 30000 -OutJson out/reveal/small-1cpu.json" \
            2>&1 | tee "out/reveal/small-1cpu.log"
      - name: summarize reveal durations
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem out/reveal/*.json | Sort-Object Name) {
            $data = Get-Content $file.FullName -Raw | ConvertFrom-Json
            $duration = if ($null -ne $data.revealStartMs -and $null -ne $data.revealDoneMs) {
              [math]::Round($data.revealDoneMs - $data.revealStartMs, 1)
            } else { "missing" }
            "{0}: reveal={1}ms frames={2} intervalMedian={3}ms p95={4}ms exit={5}" -f `
              $file.Name, $duration, $data.framesTotal, $data.intervals.medianMs, $data.intervals.p95Ms, $data.exitCode
          }
      - name: upload reveal budget artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reveal-budget
          path: out/reveal
          if-no-files-found: warn
          retention-days: 14

  drift:
    name: drift gate
    runs-on: windows-latest
    # 门禁由 eval/drift-gate.ps1 按改动路径判定；未触及 drift 输入面时 job 秒退并通过。
    # 语料用 eval/fetch-corpus.ps1 拉取并按 pin 校验，缓存 key 带 corpus.toml 哈希，
    # pin 变化自动失效。语料不可用时：
    #   - 非基线改动 -> corpus 标 skipped，coverage.missing 写明缺口，job 仍绿；
    #   - 基线/pin 改动 -> 脚本直接判红（退出 1），不允许降级通过。
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: plan
        id: plan
        shell: pwsh
        run: |
          $event = "${{ github.event_name }}"
          $base = "${{ github.base_ref }}"
          if ($base) {
            $base = "origin/$base"
          } else {
            $base = "${{ github.event.before }}"
          }
          $forceFull = $event -eq 'workflow_dispatch'
          if (-not $base -or $base -match '^0+$') {
            # dispatch 没有 before；用默认分支做 diff 基线，仍能识别基线改动，
            # 同时靠 -ForceFull 保持保守全跑。
            if ($forceFull) {
              $base = 'origin/${{ github.event.repository.default_branch }}'
            } else {
              $base = 'NONE'
            }
          }
          $planArgs = @('-NoProfile', '-File', 'eval/drift-gate.ps1', '-PlanOnly', '-BaseRef', $base)
          if ($forceFull) { $planArgs += '-ForceFull' }
          $plan = @(& pwsh @planArgs)
          $plan | Write-Output
          $required = if ($plan -contains 'required=true') { 'true' } else { 'false' }
          $corpusRequired = if ($plan -contains 'corpus_required=true') { 'true' } else { 'false' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "required=$required"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "corpus_required=$corpusRequired"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "base=$base"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "force_full=$($forceFull.ToString().ToLower())"
      - name: restore corpus cache
        id: corpus-cache
        if: steps.plan.outputs.required == 'true' && steps.plan.outputs.corpus_required == 'true'
        uses: actions/cache/restore@v4
        with:
          path: tests/corpus
          key: drift-corpus-${{ runner.os }}-${{ hashFiles('eval/corpus.toml') }}
      - name: fetch corpus
        if: steps.plan.outputs.required == 'true' && steps.plan.outputs.corpus_required == 'true' && steps.corpus-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        run: pwsh -NoProfile -File eval/fetch-corpus.ps1
      - name: verify corpus pins
        id: corpus-verify
        if: steps.plan.outputs.required == 'true' && steps.plan.outputs.corpus_required == 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -File eval/fetch-corpus.ps1 -VerifyOnly
          $verified = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "verified=$verified"
          if ($verified -ne 'true') {
            Write-Output "::warning::corpus pin 校验未通过；非基线改动将降级跳过，基线改动会判红"
          }
          exit 0
      - name: save corpus cache
        if: steps.plan.outputs.required == 'true' && steps.plan.outputs.corpus_required == 'true' && steps.corpus-cache.outputs.cache-hit != 'true' && steps.corpus-verify.outputs.verified == 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/corpus
          key: drift-corpus-${{ runner.os }}-${{ hashFiles('eval/corpus.toml') }}
      - name: build arch-cli
        if: steps.plan.outputs.required == 'true'
        run: cargo build --locked -p arch-cli
      - name: drift gate
        if: steps.plan.outputs.required == 'true'
        shell: pwsh
        env:
          PLAN_CORPUS_REQUIRED: ${{ steps.plan.outputs.corpus_required }}
          CORPUS_VERIFIED: ${{ steps.corpus-verify.outputs.verified }}
        run: |
          $argv = @('-NoProfile', '-File', 'eval/drift-gate.ps1', '-BaseRef', '${{ steps.plan.outputs.base }}')
          if ('${{ steps.plan.outputs.force_full }}' -eq 'true') {
            $argv += '-ForceFull'
          }
          if ($env:PLAN_CORPUS_REQUIRED -eq 'true' -and $env:CORPUS_VERIFIED -ne 'true') {
            $argv += '-CorpusUnavailable'
          }
          & pwsh @argv
          exit $LASTEXITCODE
      - name: upload drift artifacts
        if: always() && steps.plan.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-gate
          path: |
            out/drift-gate.json
            out/drift-*.json
          if-no-files-found: warn
          retention-days: 14
