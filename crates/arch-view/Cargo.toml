[package]
name = "arch-view"
version.workspace = true
edition.workspace = true
description = "GPUI desktop view for Strata: layered architecture map, guided path playback and evolution timeline"
repository = "https://github.com/cs1lion/strata-arch"
license.workspace = true
keywords = ["gpui", "visualization", "typescript", "architecture", "gui"]
categories = ["visualization", "development-tools", "graphics"]

[dependencies]
arch-core = { path = "../arch-core", version = "0.1.0" }
gpui = "=0.2.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
