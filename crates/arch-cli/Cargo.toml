[package]
name = "arch-cli"
version.workspace = true
edition.workspace = true
description = "Headless CLI that emits Strata's architecture, history and diff artifacts as JSON"
repository = "https://github.com/cs1lion/strata-arch"
# license 待定：发布前由维护者决定，勿填占位值
keywords = ["cli", "json", "typescript", "static-analysis", "architecture"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "arch-cli"
path = "src/main.rs"

[dependencies]
arch-core = { path = "../arch-core", version = "0.1.0" }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
