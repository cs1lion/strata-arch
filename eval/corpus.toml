# 固定样本仓 pin 清单（L2 真实仓库快照）
#
# 读取者：eval/fetch-corpus.ps1。脚本只支持本文件使用的 TOML 子集：
#   `[section]`、`[[repo]]`、`key = "字符串"`、`key = 整数`、整行 `#` 注释。
#   不支持行内注释、数组与嵌套表；新增字段时保持这一子集，否则脚本会报错退出。
#
# 缓存约定：
#   root 默认为仓根下的 tests/corpus（已在 .gitignore 中排除，不入库）。
#   环境变量 STRATA_CORPUS_DIR 可覆盖缓存根目录。
#   每个仓库解压到 <root>/<name>/，是归档副本，不含 .git。
#
# 校验约定：
#   commit 用于定位拉取内容。归档副本没有 .git，无法 rev-parse，
#   因此用内容清单校验等价性：
#     枚举 <root>/<name>/ 下全部普通文件（含隐藏文件，不含目录），
#     按相对路径（正斜杠）Ordinal 升序排序；
#     每个文件输出一行 `<sha256(文件字节，小写)> <字节数> <相对路径>`，行尾 LF；
#     对整段清单文本（UTF-8）取 SHA256，即 manifest_sha256。
#   files 为清单条数；source_files 为 index 产物 stats.files（TS/JS 源码数，不含 .d.ts 之外的过滤）。
#
# 读数说明：
#   index_* 与 callgraph_* 均为实测值；同一份缓存复跑结果应与这些数字一致。
#   callgraph_default_bytes 是 `--out` 写出的文件字节数（含末尾换行），
#   stdout 输出的字节数比它少 1。
#   修改任何 pin、files、manifest_sha256 或读数都属于 eval 期望值变更，
#   必须独立提交并说明旧读数、新读数与理由。

[cache]
root = "tests/corpus"

